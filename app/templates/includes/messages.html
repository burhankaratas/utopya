{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-2">
  {% for category, message in messages %}
  <div class="px-4 py-3 rounded-lg text-sm shadow-lg {% if category == 'danger' %}bg-red-50 text-red-800 border border-red-200{% else %}bg-green-50 text-green-800 border border-green-200{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
