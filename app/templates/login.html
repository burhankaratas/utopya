{% extends 'layout.html' %}
{% block head %}<title>Giriş — Ütopya</title>{% endblock %}

{% block body %}
<div class="min-h-[80vh] flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Ütopya'ya Giriş</h1>
      <p class="text-sm text-gray-500 mt-2">Hesabınla giriş yap.</p>
    </div>
    <form method="post" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1.5">Kullanıcı Adı</label>
        <input name="username" type="text" placeholder="kullanici_adi"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-400 transition-colors">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1.5">Şifre</label>
        <input name="password" type="password" placeholder="••••••••"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-400 transition-colors">
      </div>
      <button type="submit"
        class="w-full bg-gray-900 text-white text-sm font-medium py-2.5 rounded-lg hover:bg-gray-700 transition-colors mt-2">
        Giriş Yap
      </button>
    </form>
  </div>
</div>
{% endblock %}
